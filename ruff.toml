line-length = 100
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = []

[lint.isort]
known-first-party = ["zik_backend", "zik_user_helper", "zik_mpris_bridge"]

[format]
quote-style = "double"
indent-style = "space"
