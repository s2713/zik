[tool.poetry]
name = "zik-user-helper"
version = "0.0.1"
description = "zik per-user helper (P2) — user-scoped unix-socket service"
authors = ["zik contributors"]
license = "AGPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "zik_user_helper" }]

[tool.poetry.dependencies]
python = "^3.11"
starlette = "^0.40"
uvicorn = { version = "^0.30", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.5"

[tool.poetry.scripts]
zik-user-helper = "zik_user_helper.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
