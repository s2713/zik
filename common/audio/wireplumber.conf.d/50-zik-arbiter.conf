# 50-zik-arbiter.conf — load the zik single-arbiter Lua policy.
#
# Installed by build-image.sh to /etc/wireplumber/wireplumber.conf.d/.
# WirePlumber merges all *.conf files in that directory at startup.

wireplumber.components = [
  {
    name     = /usr/share/wireplumber/scripts/zik/zik-arbiter.lua
    type     = script/lua
    provides = custom.zik-arbiter
  }
]

wireplumber.profiles = {
  main = {
    custom.zik-arbiter = required
  }
}
