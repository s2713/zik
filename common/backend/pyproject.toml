[tool.poetry]
name = "zik-backend"
version = "0.0.1"
description = "zik system backend (P1) — music-appliance HTTP API"
authors = ["zik contributors"]
license = "AGPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "zik_backend" }]

[tool.poetry.dependencies]
python = "^3.11"
starlette = "^0.40"
uvicorn = { version = "^0.30", extras = ["standard"] }
httpx = { version = "^0.27", extras = ["http2"] }
mutagen = "^1.47.0"
aiosqlite = "^0.22.1"
python-mpd2 = ">=3.1"
cryptography = "^48.0.0"
argon2-cffi  = "^23"
mnemonic     = "^0.21"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.5"

[tool.poetry.scripts]
zik-backend = "zik_backend.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
